name: APK Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer le projet Android
        run: flutter create --platforms=android --project-name port_aval --org com.exemple .

      - name: Restaurer les fichiers versionnés
        run: git checkout -- lib pubspec.yaml

      - run: flutter pub get

      - name: Analyse statique
        run: flutter analyze --no-fatal-infos

      - name: Compiler l'APK
        run: flutter build apk --release

      - name: Publier la Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dernier-build
          name: Dernier build
          prerelease: true
          files: build/app/outputs/flutter-apk/app-release.apk

      - name: Archiver l'APK
        uses: actions/upload-artifact@v4
        with:
          name: port-aval-apk
          path: build/app/outputs/flutter-apk/app-release.apk
