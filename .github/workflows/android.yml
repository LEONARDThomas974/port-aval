name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Le dossier android/ n'est pas versionné : Flutter le régénère.
      - name: Générer le projet Android
        run: flutter create --platforms=android --project-name port_aval --org com.exemple .

      # flutter create peut écraser nos fichiers et fabrique un
      # test/widget_test.dart qui référence une classe MyApp qu'on n'a pas.
      - name: Restaurer les fichiers versionnés
        run: |
          git checkout -- lib pubspec.yaml
          rm -f test/widget_test.dart

      - run: flutter pub get

      - name: Analyse statique
        run: flutter analyze --no-fatal-infos

      - name: Compiler l'APK
        run: flutter build apk --release

      # Flutter ne dépose pas toujours l'APK au même endroit selon la
      # version. On le cherche, et on retient son chemin pour la suite.
      - name: Localiser l'APK
        run: |
          echo "--- APK trouvés ---"
          find build -name '*.apk'
          echo "CHEMIN_APK=$(find build -name '*-release.apk' | head -1)" >> $GITHUB_ENV

      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dernier-build
          name: Dernier build
          prerelease: true
          files: ${{ env.CHEMIN_APK }}

      - name: Archiver l'APK
        uses: actions/upload-artifact@v4
        with:
          name: port-aval-apk
          path: ${{ env.CHEMIN_APK }}
